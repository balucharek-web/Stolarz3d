  <polygon points="130,168 256,240 256,374 130,302" fill="url(#leftWood)" stroke="#181A1F" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="256,240 382,168 382,302 256,374" fill="url(#rightWood)" stroke="#181A1F" stroke-width="6" stroke-linejoin="round"/>
  <!-- Drawer split line & subtle gold handles -->
  <line x1="256" y1="307" x2="382" y2="235" stroke="#181A1F" stroke-width="6"/>
  <line x1="302" y1="226" x2="338" y2="205" stroke="#F6D492" stroke-width="9" stroke-linecap="round"/>
  <line x1="302" y1="293" x2="338" y2="272" stroke="#F6D492" stroke-width="9" stroke-linecap="round"/>
</svg>
