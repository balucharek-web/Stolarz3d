<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24282D"/>
      <stop offset="100%" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="topWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECC078"/>
      <stop offset="100%" stop-color="#C88D45"/>
    </linearGradient>
    <linearGradient id="leftWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C78A42"/>
      <stop offset="100%" stop-color="#8F5824"/>
    </linearGradient>
    <linearGradient id="rightWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A86E32"/>
      <stop offset="100%" stop-color="#6F4119"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Carpenter L-square beneath cabinet -->
  <path d="M108 138 L142 158 L142 328 L256 394 L374 326 L406 344 L256 432 L108 346 Z" fill="#D59A4E" stroke="#181A1F" stroke-width="6" stroke-linejoin="round"/>
